const Q=[];{const A=Q0.filter(q=>q[1]),B=Q0.filter(q=>!q[1]);let a=0;B.forEach((q,i)=>{Q.push(q);if(i%7==6&&a<A.length)Q.push(A[a++])});while(a<A.length)Q.push(A[a++])}
const rd=n=>Math.round(n*10)/10,doneT=h=>h.type=="amt"?(h.logs[today()]||0)>=h.goal:h.days.includes(today());
let cm=new Date(),sel=today(),td="";cm.setDate(1);
function qCard(){const n=new Date(),i=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)%Q.length,[t,a]=Q[i];return `<div class="card qc">“${esc(t)}”${a?`<div class="sub" style="font-style:normal;margin-top:6px">— ${esc(a)}</div>`:""}</div>`}
function setAmt(h,v){v=Math.max(0,Math.round(v*100)/100);const k=today(),i=h.days.indexOf(k);h.logs[k]=v;if(v>0&&i<0)h.days.push(k);if(v==0&&i>=0)h.days.splice(i,1);save()}
function amtSim(h){const t=today();let r=0,b=0,q=[],idx=0,d=dt(h.start),e=new Date();
 while(d<=e){const k=ymd(d);if(isS(h,d)){idx++;const v=h.logs[k]||0,isT=k===t;
  if(v<=0){if(!isT){b=Math.max(b,r);r=0;q=[]}}
  else{r++;b=Math.max(b,r);let sp=Math.max(v-h.goal,0);for(const x of q){const p=Math.min(sp,x.owed);x.owed-=p;sp-=p}q=q.filter(x=>x.owed>0);if(v<h.goal&&!isT)q.push({k,owed:h.goal-v,due:idx+h.win})}
  if(!isT&&q.some(x=>x.due<=idx&&x.owed>0)){b=Math.max(b,r);r=0;q=[]}}
 d.setDate(d.getDate()+1)}
 return{r,b,debts:q.map(x=>({k:x.k,owed:x.owed,left:Math.max(x.due-idx,0)}))}}
function amtUI(h){const v=h.logs[today()]||0,s=amtSim(h),rem=Math.max(h.goal-v,0),ow=s.debts.reduce((a,d)=>a+d.owed,0);
 return `<div class="bar"><i style="width:${Math.min(v/h.goal*100,100)}%"></i></div><div class="sub">${rd(v)} / ${h.goal} ${esc(h.unit)} today${rem?` · ${rd(rem)} to go`:" · goal hit ✓"}</div>${ow>0?`<div class="sub" style="color:var(--acc)">Make up ${rd(ow)} ${esc(h.unit)} · ${Math.min(...s.debts.map(d=>d.left))} day(s) left</div>`:""}<div class="row" style="margin-top:8px"><button data-a="la" data-h="${h.id}" data-v="${h.step}">+${h.step}</button>${rem?`<button data-a="lf" data-h="${h.id}">Fill up</button>`:""}${ow>0?`<button data-a="lm" data-h="${h.id}">Make up ✓</button>`:""}<button class="g" data-a="lc" data-h="${h.id}">Clear</button></div>`}
function typeUI(f){if(f.id)return f.type=="amt"?`<div class="sub" style="margin-bottom:12px">Goal: ${f.goal} ${esc(f.unit)} a day · make-up window ${f.win} days (locked to keep your streak honest)</div>`:"";
 return `<label>Type</label><div class="chips"><span class="chip ${f.type=="tap"?"on":""}" data-a="ty" data-v="tap">Tap (done / not done)</span><span class="chip ${f.type=="amt"?"on":""}" data-a="ty" data-v="amt">Target amount</span></div>`+(f.type=="amt"?`<div class="row"><div class="f"><label>Daily goal</label><input id="fg" type="number" min="1" value="${f.goal}"></div><div class="f"><label>Unit</label><input id="fu" maxlength="10" value="${esc(f.unit)}"></div></div><div class="row"><div class="f"><label>Quick-add</label><input id="fs" type="number" min="1" value="${f.step}"></div><div class="f"><label>Make-up days</label><input id="fw" type="number" min="1" max="14" value="${f.win}"></div></div>`:"")}
function addT(){const v=td.trim();if(v){(S.tasks[sel]=S.tasks[sel]||[]).push({id:Date.now().toString(36),t:v,d:0});td="";save()}}
function planUI(){const y=cm.getFullYear(),m=cm.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),T=S.tasks;
 let g=["M","T","W","T","F","S","S"].map(d=>`<div class="sub" style="text-align:center">${d}</div>`).join("");
 for(let i=0;i<first;i++)g+="<div></div>";
 for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),ts=T[k]||[],p=ts.filter(x=>!x.d).length;g+=`<div class="cd ${k==sel?"on":""} ${k==today()?"t":""}" data-a="sd2" data-v="${k}">${d}<i class="${ts.length?(p?"o":"x"):""}"></i></div>`}
 const L=T[sel]||[];
 return `<div class="row"><button class="g" data-a="pm" data-v="-1">‹</button><b class="f" style="text-align:center">${cm.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button class="g" data-a="pm" data-v="1">›</button></div><div class="cal">${g}</div><h2>${dt(sel).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2>${L.map(x=>`<div class="card row"><span class="chip ${x.d?"on":""}" data-a="tk" data-v="${x.id}">${x.d?"✓":"○"}</span><span class="f" style="${x.d?"text-decoration:line-through;color:var(--mut)":""}">${esc(x.t)}</span><span class="sub" data-a="tx" data-v="${x.id}" style="cursor:pointer;padding:4px">✕</span></div>`).join("")||`<div class="sub">No tasks yet.</div>`}<div class="row" style="margin-top:10px"><input id="tn" class="f" placeholder="Add a task for this day" value="${esc(td)}" style="margin:0"><button data-a="ta">Add</button></div>`}

function card(h){const c=cur(h),b=best(h),t=today(),sch=isS(h,new Date()),dn=h.days.includes(t),o=open[h.id];
  let x=`<div class="card"><div class="hd" data-a="op" data-h="${h.id}"><div><b>${esc(h.name)}</b><div class="sub">${h.sched.length==7?"Every day":ORD.filter(i=>h.sched.includes(i)).map(i=>DN[i]).join(" · ")}</div></div><div class="fl">🔥 ${c}<span class="sub"> / ${h.target}</span></div></div><div class="bar"><i style="width:${Math.min(c/h.target*100,100)}%"></i></div><div class="row"><div class="sub f">Best ${b} · ${new Set(h.days).size} total${c>=h.target?" · Target hit! 🎉":""}</div>`;
  x+=sch&&h.type!="amt"?`<button data-a="ck" data-h="${h.id}" class="${dn?"d":""}">${dn?"Done ✓":"Check in"}</button>`:sch?"":`<span class="sub">Rest day</span>`;
  x+=`</div>`+(sch&&h.type=="amt"?amtUI(h):"");
  if(o){let dots="";for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ymd(d);dots+=`<i title="${k}" class="${h.days.includes(k)?"on":""} ${isS(h,d)?"":"na"} ${i==0?"t":""}"></i>`}
    const ns=Object.keys(h.notes).sort().reverse().filter(k=>k!==t).slice(0,6);
    x+=`<div class="dots">${dots}</div><label>What did you gain today from sticking with this?</label><textarea data-n="${h.id}" placeholder="A win, a feeling, a lesson…">${esc(h.notes[t]||"")}</textarea>`;
    if(ns.length)x+=`<div class="sub">Earlier gains</div>`+ns.map(k=>`<div class="note"><span class="sub">${fmt(dt(k))}</span><br>${esc(h.notes[k])}</div>`).join("");
    x+=`<div class="row" style="margin-top:12px"><button class="g" data-a="ed" data-h="${h.id}">Edit</button><button class="g" data-a="del" data-h="${h.id}">${armed===h.id?"Tap again to delete":"Delete"}</button></div>`}
  return x+`</div>`}
function render(){const app=$("#app");
  if(form){const f=form;app.innerHTML=`<h1>${f.id?"Edit habit":"New habit"}</h1><div class="card"><label>Habit</label><input id="fn" maxlength="40" placeholder="e.g. Deep work, 1 hour" value="${esc(f.name)}">${typeUI(f)}<label>Target streak (scheduled days in a row)</label><div class="chips">${[30,100,180,365].map(n=>`<span class="chip ${f.target==n?"on":""}" data-a="tg" data-v="${n}">${n==365?"1 year":n==180?"6 months":n+" days"}</span>`).join("")}</div><input id="ft" type="number" min="1" max="3650" value="${f.target}"><label>Days it must be done${f.id?" (changes apply from tomorrow)":""}</label><div class="chips">${ORD.map(i=>`<span class="chip ${f.sched.includes(i)?"on":""}" data-a="sd" data-v="${i}">${DN[i]}</span>`).join("")}<span class="chip" data-a="pre" data-v="all">Every day</span><span class="chip" data-a="pre" data-v="wk">Weekdays</span></div><div class="row"><button class="g f" data-a="cx">Cancel</button><button class="f" data-a="sv">Save</button></div></div>`;return}
  const t=today(),sch=S.habits.filter(h=>isS(h,new Date())),dn=sch.filter(doneT).length;
  let x=`<h1>Streak Chaser 🔥</h1><div class="tabs"><button class="${tab=="today"?"on":""}" data-a="tab" data-v="today">Today</button><button class="${tab=="snap"?"on":""}" data-a="tab" data-v="snap">Snapshot</button><button class="${tab=="plan"?"on":""}" data-a="tab" data-v="plan">Plan</button></div>`;
  if(tab=="today"){
    x+=qCard()+rvCard();
    x+=S.habits.length?`<div class="card"><b>${dn} of ${sch.length}</b> done today<div class="bar"><i style="width:${sch.length?dn/sch.length*100:0}%"></i></div></div>`:`<div class="card sub">No habits yet. Add your first one and start chasing.</div>`;
    x+=sch.map(card).join("");
    const rest=S.habits.filter(h=>!sch.includes(h));if(rest.length)x+=`<h2>Not scheduled today</h2>`+rest.map(card).join("");
    x+=`<button style="width:100%;margin-top:6px" data-a="add">+ Add habit</button>`}
  else if(tab=="plan")x+=planUI();
  else{
    x+=`<div class="tabs">${[["week","This week"],["month","This month"],["quarter","This quarter"]].map(([k,l])=>`<button class="${per==k?"on":""}" data-a="per" data-v="${k}">${l}</button>`).join("")}</div>`;
    if(!S.habits.length)x+=`<div class="card sub">Add habits to see your snapshot.</div>`;
    else{const a=pstart(),R=S.habits.map(h=>({h,s:stat(h,a)})),sc=R.reduce((q,r)=>q+r.s.sc,0),dn2=R.reduce((q,r)=>q+r.s.dn,0),g=R.reduce((q,r)=>q+r.s.g,0),p=sc?Math.round(dn2/sc*100):0;
      x+=`<div class="card" style="text-align:center"><div class="big">${p}%</div><div class="sub">${dn2} of ${sc} scheduled check-ins done · ${g} gains logged</div><div class="bar"><i style="width:${p}%"></i></div></div>`;
      const act=R.filter(r=>r.s.sc);if(act.length>1){const q=act.slice().sort((m,n)=>n.s.p-m.s.p);x+=`<div class="card sub">Strongest: <b>${esc(q[0].h.name)}</b> (${q[0].s.p}%) · Needs love: <b>${esc(q[q.length-1].h.name)}</b> (${q[q.length-1].s.p}%)</div>`}
      x+=`<h2>By habit</h2>`+R.map(r=>`<div class="card"><div class="hd"><b>${esc(r.h.name)}</b><span class="fl">${r.s.p}%</span></div><div class="bar"><i style="width:${r.s.p}%"></i></div><div class="sub">${r.s.dn}/${r.s.sc} done · streak 🔥 ${cur(r.h)} · ${r.s.g} gains logged</div></div>`).join("")}
    const rk=Object.keys(S.reviews).sort().reverse().slice(0,4);
    if(rk.length)x+=`<h2>Past weekly reviews</h2>`+rk.map(k=>{const r=S.reviews[k];return `<div class="card"><div class="hd"><b>Week of ${fmt(dt(k))}</b><span class="fl">${r.p}%</span></div>${r.w?`<div class="note"><span class="sub">Worked</span><br>${esc(r.w)}</div>`:""}${r.c?`<div class="note"><span class="sub">Change</span><br>${esc(r.c)}</div>`:""}</div>`}).join("");
    x+=`<h2>Backup</h2><div class="card"><div class="sub">Your data lives on this device. Move it to another device or keep a copy.</div><div class="row" style="margin-top:10px"><button class="g f" data-a="bk" data-v="show">Show backup code</button><button class="g f" data-a="bk" data-v="rest">Restore</button></div>`;
    if(bk=="show")x+=`<textarea id="bx" readonly style="margin-top:10px">${esc(JSON.stringify(S))}</textarea><div class="sub">Select all, copy, and keep it somewhere safe.</div>`;
    if(bk=="rest")x+=`<textarea id="br" placeholder="Paste backup code" style="margin-top:10px"></textarea>${bkErr?`<div class="sub">That code didn’t look right.</div>`:""}<button data-a="rs" style="width:100%">Replace data on this device</button>`;
    x+=`</div>`}
  app.innerHTML=x}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,h=el.dataset.h?H(el.dataset.h):null,v=el.dataset.v;
  if(a=="tab"){tab=v;armed=null}else if(a=="per")per=v;else if(a=="op")open[h.id]=!open[h.id];
  else if(a=="ck")return toggleToday(h);
  else if(a=="add")form={name:"",target:365,sched:[0,1,2,3,4,5,6],type:"tap",goal:120,unit:"min",step:30,win:3};
  else if(a=="ty")form.type=v;
  else if(a=="la")setAmt(h,(h.logs[today()]||0)+ +v);
  else if(a=="lf")setAmt(h,Math.max(h.goal,h.logs[today()]||0));
  else if(a=="lm")setAmt(h,Math.max(h.goal,h.logs[today()]||0)+amtSim(h).debts.reduce((q,d)=>q+d.owed,0));
  else if(a=="lc")setAmt(h,0);
  else if(a=="sd2")sel=v;else if(a=="pm")cm.setMonth(cm.getMonth()+ +v);
  else if(a=="ta")addT();
  else if(a=="tk"){const x=(S.tasks[sel]||[]).find(q=>q.id==v);if(x){x.d=!x.d;save()}}
  else if(a=="tx"){S.tasks[sel]=(S.tasks[sel]||[]).filter(q=>q.id!=v);save()}
  else if(a=="ed")form={id:h.id,name:h.name,target:h.target,sched:h.sched.slice(),type:h.type||"tap",goal:h.goal,unit:h.unit,step:h.step,win:h.win};
  else if(a=="del"){if(armed!==h.id){armed=h.id}else{S.habits=S.habits.filter(x=>x!==h);armed=null;save()}}
  else if(a=="cx")form=null;else if(a=="tg")form.target=+v;
  else if(a=="sd"){const i=+v,s=form.sched;s.includes(i)?s.length>1&&s.splice(s.indexOf(i),1):s.push(i)}
  else if(a=="pre")form.sched=v=="all"?[0,1,2,3,4,5,6]:[1,2,3,4,5];
  else if(a=="sv"){const n=form.name.trim()||"My habit",tg=Math.max(1,Math.min(3650,+form.target||365));
    if(form.id){const x=H(form.id);x.name=n;x.target=tg;
      if(JSON.stringify(x.sched.slice().sort())!==JSON.stringify(form.sched.slice().sort())){const tm=new Date();tm.setDate(tm.getDate()+1);const k=ymd(tm);x.hist=x.hist.filter(q=>q[0]<k);x.hist.push([k,form.sched.slice()]);x.sched=form.sched.slice()}}
    else S.habits.push({id:"h"+Date.now().toString(36),name:n,target:tg,start:today(),days:[],sched:form.sched.slice(),hist:[[today(),form.sched.slice()]],notes:{},type:form.type,...(form.type=="amt"?{goal:Math.max(1,+form.goal||1),unit:(form.unit||"").trim()||"units",step:Math.max(1,+form.step||1),win:Math.max(1,Math.min(14,+form.win||3)),logs:{}}:{})});
    form=null;save()}
  else if(a=="rv"){const rk=rkey();S.reviews[rk]={w:($("#rw").value||"").trim(),c:($("#rc").value||"").trim(),p:rcalc(rk).p};dr={w:"",c:""};save()}
  else if(a=="bk")bk=bk==v?null:v;
  else if(a=="rs"){try{const raw=JSON.parse($("#br").value);if(!raw||!(raw.habits||raw.days))throw 0;S=norm(raw);bk=null;bkErr=false;save()}catch(x){bkErr=true}}
  render()});
document.addEventListener("input",e=>{const i=e.target.id;if(form){if(i=="fn")form.name=e.target.value;if(i=="ft")form.target=e.target.value;if(i=="fg")form.goal=e.target.value;if(i=="fu")form.unit=e.target.value;if(i=="fs")form.step=e.target.value;if(i=="fw")form.win=e.target.value}if(i=="tn")td=e.target.value;if(i=="rw")dr.w=e.target.value;if(i=="rc")dr.c=e.target.value});

render();
if("serviceWorker"in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
(async()=>{try{if(!window.claude||!claude.use)return;const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return;const id=await user.id();if(!id)return;
  ref=db.collection("data/users/"+id).doc("tracker");const s=await ref.get();

    S.habits.forEach(l=>{const m=r.habits.find(x=>x.id===l.id);if(m){m.days=[...new Set([...m.days,...l.days])];m.notes=Object.assign({},m.notes,l.notes);if(l.logs)m.logs=Object.assign({},m.logs,l.logs);if(l.hist.length>m.hist.length){m.hist=l.hist;m.sched=l.sched}}else r.habits.push(l)});
    r.reviews=Object.assign({},r.reviews,S.reviews);r.tasks=Object.assign({},r.tasks,S.tasks);S=r;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
    const ae=document.activeElement;if(!form&&!(ae&&ae.tagName=="TEXTAREA"))render();save()}
  else if(S.habits.length)await save()}catch(e){}})();
